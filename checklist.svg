<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="758" height="558" rx="22" fill="#FFFDF9" stroke="#E7DECE" stroke-width="1.5"/>

  <text x="40" y="56" fill="#1C1A2E" font-size="25" font-weight="700">Cinq questions avant de brancher une IA sur son SAV</text>
  <text x="40" y="82" fill="#6B6680" font-size="13.5">La grille qui sépare un outil qui aide d'un outil qui improvise.</text>

  <!-- lignes -->
  <g>
    <!-- 1 -->
    <rect x="40" y="108" width="680" height="70" rx="14" fill="#3E63DD" fill-opacity="0.06" stroke="#DCE3FB" stroke-width="1.2"/>
    <circle cx="76" cy="143" r="16" fill="#3E63DD"/>
    <text x="76" y="149" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">1</text>
    <text x="108" y="138" fill="#1C1A2E" font-size="15.5" font-weight="600">Hébergement</text>
    <text x="108" y="160" fill="#6B6680" font-size="12.5">Où vivent les données du client, dans l'UE ou hors UE ?</text>

    <!-- 2 -->
    <rect x="40" y="188" width="680" height="70" rx="14" fill="#3E63DD" fill-opacity="0.06" stroke="#DCE3FB" stroke-width="1.2"/>
    <circle cx="76" cy="223" r="16" fill="#3E63DD"/>
    <text x="76" y="229" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">2</text>
    <text x="108" y="218" fill="#1C1A2E" font-size="15.5" font-weight="600">Capacités réelles</text>
    <text x="108" y="240" fill="#6B6680" font-size="12.5">Sait-il clore commande, retour et remboursement, ou seulement bavarder ?</text>

    <!-- 3 -->
    <rect x="40" y="268" width="680" height="70" rx="14" fill="#3E63DD" fill-opacity="0.06" stroke="#DCE3FB" stroke-width="1.2"/>
    <circle cx="76" cy="303" r="16" fill="#3E63DD"/>
    <text x="76" y="309" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">3</text>
    <text x="108" y="298" fill="#1C1A2E" font-size="15.5" font-weight="600">Escalade</text>
    <text x="108" y="320" fill="#6B6680" font-size="12.5">Passe-t-il la main à un humain quand il doute, plutôt que d'inventer ?</text>

    <!-- 4 -->
    <rect x="40" y="348" width="680" height="70" rx="14" fill="#3E63DD" fill-opacity="0.06" stroke="#DCE3FB" stroke-width="1.2"/>
    <circle cx="76" cy="383" r="16" fill="#3E63DD"/>
    <text x="76" y="389" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">4</text>
    <text x="108" y="378" fill="#1C1A2E" font-size="15.5" font-weight="600">Traçabilité</text>
    <text x="108" y="400" fill="#6B6680" font-size="12.5">Chaque décision est-elle journalisée et vérifiable après coup ?</text>

    <!-- 5 -->
    <rect x="40" y="428" width="680" height="70" rx="14" fill="#FF7A59" fill-opacity="0.08" stroke="#FFE1D6" stroke-width="1.2"/>
    <circle cx="76" cy="463" r="16" fill="#F0553A"/>
    <text x="76" y="469" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">5</text>
    <text x="108" y="458" fill="#1C1A2E" font-size="15.5" font-weight="600">Coût réel</text>
    <text x="108" y="480" fill="#6B6680" font-size="12.5">Installation, mensuel et intégration boutique, pas seulement le prix affiché.</text>
  </g>

  <text x="40" y="530" fill="#9A94A8" font-size="11" font-family="ui-monospace, Menlo, monospace">bynevolabs.com · SAV e-commerce, IA souveraine hébergée en France</text>
</svg>
